# Data of the `skill add` command of @clapp/ai-workflow-plugins.
# The created skill as key-value pairs: no sections and no description are produced.
$schema: https://json-schema.org/draft/2020-12/schema
$id: skill-add
title: Data of the `skill add` command
description: A titled list of pairs naming the created skill, its scope and its path.
type: object
required: [title, pairs]
additionalProperties: false
properties:
  title:
    description: Heading above the pairs.
    type: string
  pairs:
    description: Name, scope and path of the created skill.
    type: array
    items:
      type: object
      required: [key]
      additionalProperties: false
      properties:
        key:
          description: Name of the reported field.
          type: string
        value:
          description: Value of the reported field.
          type: [string, number, boolean, 'null']
